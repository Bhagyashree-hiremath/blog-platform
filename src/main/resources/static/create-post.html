<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Post - Blog Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📝 Blog Platform</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main>

    <section class="hero">

        <h2>Create a New Post</h2>

        <form id="create-post-form">

            <input
                type="text"
                id="title"
                placeholder="Post title"
                required
            >

            <br><br>

            <textarea
                id="content"
                placeholder="Write your post..."
                rows="10"
                required
            ></textarea>

            <br><br>

            <button type="submit">
                Publish Post
            </button>

        </form>

        <p id="post-message"></p>

    </section>

</main>

<footer>
    <p>© 2026 Blog Platform</p>
</footer>

<script src="create-post.js"></script>

</body>
</html>
