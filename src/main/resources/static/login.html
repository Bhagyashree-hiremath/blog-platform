<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Blog Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📝 Blog Platform</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main>

    <section class="hero">

        <h2>Login</h2>

        <form id="login-form">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="login-message"></p>

    </section>

</main>

<footer>
    <p>© 2026 Blog Platform</p>
</footer>

<script src="login.js"></script>

</body>
</html>
